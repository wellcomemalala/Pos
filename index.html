<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>หน้าจอครัว - นักซิ่ง</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    html { touch-action: manipulation; }
    body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; color: #000; margin: 0; padding: 10px; }

    #syncStatusBar { position:fixed; top:0; left:0; right:0; height:35px; background:#27ae60; color:white; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; z-index:1001; gap:12px; }
    #syncStatusBar.offline { background:#c0392b; }

    /* ================= แถบเตือน "คิวค้างนานสุด" ================= */
    #queueAlertBar { position:fixed; top:35px; left:0; right:0; min-height:36px; background:#34495e; color:white; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 10px; font-size:15px; font-weight:bold; z-index:1000; padding:6px 12px; text-align:center; box-sizing:border-box; transition:background 0.3s; }
    #queueAlertBar.urgent { animation: alertPulseBg 1.2s infinite; }
    @keyframes alertPulseBg { 0%,100% { background:#34495e; } 50% { background:#c0392b; } }
    .queue-alert-label { flex:0 0 auto; }
    .queue-alert-chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
    .queue-alert-chip { display:inline-flex; align-items:center; gap:3px; background:rgba(255,255,255,0.12); border:2px solid #7f8c8d; border-radius:14px; padding:3px 10px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .queue-alert-chip.chip-urgent { background:rgba(231,76,60,0.85); border-color:#ffdcdc; }
    .chip-comment { background:#fff3cd; color:#856404; padding:1px 7px; border-radius:8px; margin:0 2px; }
    @keyframes pulseHighlight { 0%,100% { box-shadow:0 6px 15px rgba(0,0,0,0.05); } 50% { box-shadow:0 0 0 8px rgba(231,76,60,0.65); } }
    .pulse-highlight { animation: pulseHighlight 0.6s ease-in-out 3; }
    /* ================= จบแถบเตือนคิวค้างนานสุด ================= */

    /* ================= สไตล์ Offline Blocking Overlay ================= */
    #offlineOverlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20, 10, 10, 0.92);
      z-index: 10000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
    }
    #offlineOverlay.show { display: flex; }
    #offlineBox {
      background: white; border-radius: 20px; padding: 40px 32px;
      max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      border: 3px solid #e74c3c;
    }
    #offlineIcon { font-size: 56px; margin-bottom: 8px; animation: offlinePulse 1.2s infinite; }
    #offlineBox h2 { color: #c0392b; font-size: 28px; margin: 8px 0; }
    #offlineBox p { color: #555; font-size: 17px; line-height: 1.5; margin: 12px 0 20px; }
    #offlineSpinner {
      width: 36px; height: 36px; margin: 0 auto 12px;
      border: 4px solid #f1c2c2; border-top-color: #e74c3c;
      border-radius: 50%; animation: offlineSpin 0.8s linear infinite;
    }
    #offlineWaitText { color: #e74c3c; font-size: 15px; font-weight: bold; }
    @keyframes offlineSpin { to { transform: rotate(360deg); } }
    @keyframes offlinePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    /* ================= จบสไตล์ Offline Blocking Overlay ================= */
    #adminBtn { background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.5); color:white; font-size:13px; padding:3px 10px; border-radius:6px; cursor:pointer; font-weight:bold; }
    #adminBtn:hover { background:rgba(255,255,255,0.35); }

    .controls { margin:81px 0 15px; background:#fff; padding:15px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .chef-selector { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
    .selector-btn { padding:12px 20px; font-size:20px; font-weight:bold; border:3px solid #ddd; border-radius:10px; cursor:pointer; background:#f8f9fa; color:#555; transition:0.2s; flex:1; min-width:100px; }
    .selector-btn.active { background:#007bff; color:white; border-color:#0056b3; box-shadow:0 4px 12px rgba(0,123,255,0.3); }

    /* ระบบจอครัว: บังคับให้ทุกคอลัมน์แม่ครัวอยู่ "แถวเดียว" เสมอ ไม่ดันตกไปแถวล่าง
       จำนวนคอลัมน์ปรับอัตโนมัติตามจำนวนแม่ครัวที่เปิดใช้งาน (ตั้งค่าด้วย JS ผ่าน updateGridColumns()) */
    .kitchen-grid { display:grid; gap:12px; margin-top:10px; grid-template-columns:repeat(1,1fr); align-items:stretch; }
    .chef-column { background:#fff; border-radius:20px; padding:15px; border:2px solid #dee2e6; box-shadow:0 6px 15px rgba(0,0,0,0.05); box-sizing:border-box; min-width:0; display:flex; flex-direction:column; height:100%; }
    .chef-column h3 { text-align:center; font-size:32px; margin:0 0 15px; padding-bottom:10px; border-bottom:4px solid #007bff; color:#007bff; flex:0 0 auto; }
    /* รายการออเดอร์ของแต่ละแม่ครัวเลื่อนขึ้น-ลงอิสระในกรอบตัวเอง แทนที่จะเลื่อนทั้งหน้าจอ
       ทำให้ "หัวข้อชื่อแม่ครัว + ออเดอร์บนสุด(เก่าสุด)" ของทุกคนเห็นพร้อมกันตลอดเวลา */
    .chef-column > div[id^="list-"] { flex:1 1 auto; overflow-y:auto; min-height:0; padding-right:4px; -webkit-overflow-scrolling:touch; }

    /* ปรับขนาดตัวอักษร/ระยะห่างลงเล็กน้อยเมื่อมีคอลัมน์เยอะขึ้น เพื่อให้ยังพอดีจอโดยไม่ต้องเลื่อน */
    .kitchen-grid.cols-3 .chef-column h3 { font-size:27px; }
    .kitchen-grid.cols-3 .card-header { font-size:24px; padding:9px 13px; }
    .kitchen-grid.cols-3 .table-item { font-size:23px; padding:12px 16px; }
    .kitchen-grid.cols-3 .qty-circle { min-width:36px; height:36px; font-size:20px; }
    .kitchen-grid.cols-3 .card-comment { font-size:18px; }

    .kitchen-grid.cols-4 .chef-column, .kitchen-grid.cols-5 .chef-column, .kitchen-grid.cols-6 .chef-column { padding:10px; }
    .kitchen-grid.cols-4 .chef-column h3, .kitchen-grid.cols-5 .chef-column h3, .kitchen-grid.cols-6 .chef-column h3 { font-size:23px; margin-bottom:10px; padding-bottom:7px; }
    .kitchen-grid.cols-4 .card-header, .kitchen-grid.cols-5 .card-header, .kitchen-grid.cols-6 .card-header { font-size:20px; padding:8px 10px; }
    .kitchen-grid.cols-4 .table-item, .kitchen-grid.cols-5 .table-item, .kitchen-grid.cols-6 .table-item { font-size:19px; padding:10px 14px; }
    .kitchen-grid.cols-4 .qty-circle, .kitchen-grid.cols-5 .qty-circle, .kitchen-grid.cols-6 .qty-circle { min-width:32px; height:32px; font-size:17px; }
    .kitchen-grid.cols-4 .card-comment, .kitchen-grid.cols-5 .card-comment, .kitchen-grid.cols-6 .card-comment { font-size:16px; }

    .order-card { background:#fff; margin-bottom:15px; padding:0; border-radius:15px; border:3px solid #007bff; overflow:hidden; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
    .card-header { background:#007bff; color:white; padding:10px 15px; font-size:28px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .card-header.ready { background:#6c757d; text-decoration:line-through; opacity:0.8; }
    .card-comment { background:#fff3cd; color:#856404; padding:5px 15px; font-size:20px; font-weight:bold; border-bottom:1px solid #ffeeba; }
    .table-list { padding:5px 0; background:white; }
    .table-item { padding:15px 20px; font-size:26px; font-weight:bold; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .table-item:last-child { border-bottom:none; }
    .table-item.ready { background:#e8f5e9; color:#aaa; text-decoration:line-through; }
    .table-item.ready .qty-circle { background:#aaa; }
    .qty-circle { background:#007bff; color:white; min-width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .home-tag {
      display:inline-block;
      color:#ffffff !important;
      font-size:19px;
      font-weight:800;
      letter-spacing:0.3px;
      padding:3px 11px;
      border-radius:8px;
      border:2px solid rgba(255,255,255,0.92);
      box-shadow:0 2px 5px rgba(0,0,0,0.22);
      text-shadow:0 1px 2px rgba(0,0,0,0.45);
      line-height:1.25;
      vertical-align:middle;
    }
    .home-tag-sm {
      font-size:13px;
      padding:1px 8px;
      margin:0 2px;
      border-radius:6px;
      border-width:1.5px;
    }
    .table-item.ready .home-tag { opacity:0.5; text-decoration:line-through; }
    .hidden { display:none !important; }

    /* ===== [NEW] แตะ 2 ครั้งเพื่อยืนยันว่าเสร็จ ===== */
    .tap-armed { background:#ffefc2 !important; color:#8a5a00 !important; text-decoration:none !important; }
    .tap-armed .qty-circle { background:#f39c12 !important; color:#fff !important; }
    .tap-armed::after { content:'👆 แตะอีกครั้ง'; font-size:0.55em; font-weight:bold; color:#b9770e; margin-left:8px; white-space:nowrap; animation:tapBlink .7s ease-in-out infinite alternate; }
    @keyframes tapBlink { from { opacity:1; } to { opacity:0.25; } }

    /* ===== [NEW] ปัดซ้ายเพื่อซ่อน / เรียกกลับ ===== */
    .card-wrap { position:relative; overflow:hidden; border-radius:15px; margin-bottom:15px; }
    .card-wrap > .order-card { margin-bottom:0; transition:transform .18s ease; position:relative; z-index:2; }
    .card-wrap.swiped > .order-card { transform:translateX(-100px); }
    .hdr-wrap { position:relative; overflow:hidden; flex:0 0 auto; }
    .hdr-wrap > h3 { transition:transform .18s ease; position:relative; z-index:2; background:#fff; }
    .hdr-wrap.swiped > h3 { transform:translateX(-118px); }
    .swipe-btn { position:absolute; top:0; right:0; height:100%; border:0; color:#fff; font-weight:bold; font-size:15px; line-height:1.3; cursor:pointer; z-index:1; display:flex; align-items:center; justify-content:center; text-align:center; }
    .swipe-hide { width:100px; background:#8e44ad; }
    .swipe-show { width:118px; background:#16a085; }
    .hid-badge { align-items:center; margin-left:8px; font-size:0.5em; background:#8e44ad; color:#fff; padding:3px 9px; border-radius:11px; vertical-align:middle; }

    /* ====== Admin Panel ====== */
    #adminOverlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.75); z-index:10000; overflow-y:auto; padding:10px; box-sizing:border-box; }
    #adminOverlay.show { display:block; }
    #adminPanel { background:#f8f9fa; max-width:860px; margin:20px auto 40px; border-radius:16px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.3); }
    .admin-header { background:linear-gradient(135deg,#e67e22,#f39c12); padding:18px 24px; display:flex; align-items:center; justify-content:space-between; }
    .admin-tabs { background:white; padding:12px 20px; border-bottom:1px solid #e9ecef; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .adm-tab { background:#f1f3f5; border:2px solid transparent; padding:7px 16px; border-radius:20px; font-size:15px; font-weight:600; cursor:pointer; color:#555; transition:all 0.2s; }
    .adm-tab.active { background:#e67e22 !important; color:white !important; border-color:#e67e22 !important; }
    .admin-body { padding:20px; }

    /* tab 1: เพิ่มเมนูใหม่ */
    .field-label { font-size:14px; font-weight:600; color:#555; margin-bottom:4px; }
    .field-group { margin-bottom:14px; }
    .adm-input { width:100%; font-size:16px; padding:9px 14px; border:2px solid #e67e22; border-radius:8px; box-sizing:border-box; }
    .adm-input:focus { outline:none; border-color:#c0392b; }
    .adm-select { width:100%; font-size:16px; padding:9px 12px; border:2px solid #e67e22; border-radius:8px; background:white; }
    .adm-btn-primary { background:#e67e22; color:white; border:none; padding:11px 24px; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; width:100%; }
    .adm-btn-primary:hover { background:#d35400; }
    .chef-checkbox-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px; }
    .chef-checkbox-item { background:white; border:2px solid #ddd; border-radius:8px; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; transition:all 0.15s; }
    .chef-checkbox-item.selected { background:#fff3e0; border-color:#e67e22; color:#e67e22; }
    .chef-checkbox-item input { display:none; }

    /* tab 2: กำหนดเมนูให้แม่ครัว */
    .chef-card { background:white; border:2px solid #dee2e6; border-radius:12px; margin-bottom:14px; overflow:hidden; }
    .chef-card-header { background:#007bff; color:white; padding:10px 16px; font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
    .chef-keyword-list { padding:10px 14px; display:flex; flex-wrap:wrap; gap:6px; }
    .chef-keyword-tag { background:#e8f4fd; border:1px solid #007bff; color:#007bff; padding:4px 10px; border-radius:20px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:5px; }
    .chef-keyword-tag button { background:none; border:none; color:#e74c3c; cursor:pointer; font-size:14px; padding:0; line-height:1; }
    .chef-add-kw { display:flex; gap:6px; padding:8px 14px 12px; }
    .chef-kw-input { flex:1; font-size:15px; padding:7px 10px; border:2px solid #007bff; border-radius:8px; }
    .chef-kw-btn { background:#007bff; color:white; border:none; padding:7px 14px; border-radius:8px; font-size:15px; cursor:pointer; font-weight:bold; }

    /* tab 3: แก้ราคา */
    .price-row-adm { display:flex; align-items:center; justify-content:space-between; padding:9px 8px; border-bottom:1px solid #eee; font-size:15px; gap:8px; }
    .price-row-adm:last-child { border-bottom:none; }
    .price-input-adm { width:80px; padding:5px 8px; border:2px solid #ddd; border-radius:6px; font-size:15px; text-align:right; }
    .price-input-adm:focus { border-color:#27ae60; outline:none; }
    .price-chef-badge { font-size:11px; color:#fff; background:#007bff; padding:2px 7px; border-radius:10px; margin-left:5px; }

    /* PIN overlay */
    #kitchenPinOverlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center; }
    #kitchenPinOverlay.show { display:flex; }
    .kpin-box { background:white; border-radius:16px; padding:28px; max-width:320px; width:90%; text-align:center; }
    .kpin-dot { width:16px; height:16px; border-radius:50%; border:2px solid #555; display:inline-block; margin:0 6px; }
    .kpin-dot.filled { background:#2c3e50; border-color:#2c3e50; }
    .kpin-key { background:#f8f9fa; border:2px solid #ddd; border-radius:10px; font-size:22px; font-weight:bold; padding:13px; cursor:pointer; color:#2c3e50; }
    .kpin-key:active { background:#ddd; }

    #admSaveStatus { font-size:12px; color:#aaa; }

    /* ================= Access Code Overlay ================= */
    #accessOverlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      z-index: 9999; align-items: center; justify-content: center;
    }
    #accessOverlay.show { display: flex; }
    #accessBox {
      background: white; border-radius: 20px; padding: 36px 32px;
      max-width: 380px; width: 92%; text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }
    #accessInput {
      width: 100%; font-size: 28px; text-align: center; letter-spacing: 6px;
      padding: 14px; border: 3px solid #ddd; border-radius: 12px;
      box-sizing: border-box; margin: 16px 0 8px; color: #2c3e50;
    }
    #accessInput:focus { outline: none; border-color: #007bff; }
    #accessBtn {
      width: 100%; background: linear-gradient(135deg, #007bff, #0056b3);
      color: white; border: none; padding: 14px; border-radius: 12px;
      font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    #accessBtn:hover { opacity: 0.9; }
    #accessError { color: #e74c3c; font-size: 15px; min-height: 22px; margin: 6px 0 0; }
    /* ================= จบ Access Code Overlay ================= */
  </style>
</head>
<body>

<div id="syncStatusBar">
  <span id="syncStatusText">กำลังเชื่อมต่อ...</span>
</div>

<div id="queueAlertBar">
  <span>✅ ไม่มีคิวค้างนาน</span>
</div>

<!-- ================= Offline Blocking Overlay ================= -->
<div id="offlineOverlay">
  <div id="offlineBox">
    <div id="offlineIcon">📡</div>
    <h2>การเชื่อมต่อขาดหาย</h2>
    <p>กรุณาตรวจสอบสัญญาณอินเทอร์เน็ต / WiFi ก่อนใช้งานต่อ<br>
       ระบบจะปลดล็อกให้อัตโนมัติเมื่อเชื่อมต่อกลับมา</p>
    <div id="offlineSpinner"></div>
    <div id="offlineWaitText">กำลังรอการเชื่อมต่อ...</div>
  </div>
</div>
<!-- ================= จบ Offline Blocking Overlay ================= -->

<!-- ================= Access Code Overlay ================= -->
<div id="accessOverlay" class="show">
  <div id="accessBox">
    <div style="font-size:48px; margin-bottom:8px;">🔐</div>
    <div style="font-size:22px; font-weight:bold; color:#2c3e50; margin-bottom:4px;">จอครัว</div>
    <div style="font-size:15px; color:#7f8c8d; margin-bottom:4px;">กรุณาใส่รหัสเข้าใช้งาน</div>
    <input type="password" id="accessInput" placeholder="••••••" maxlength="12"
      onkeydown="if(event.key==='Enter') checkAccessCode()"
      autocomplete="off">
    <button id="accessBtn" onclick="checkAccessCode()">✅ เข้าใช้งาน</button>
    <p id="accessError"></p>
  </div>
</div>
<!-- ================= จบ Access Code Overlay ================= -->

<!-- Main kitchen UI -->
<div class="controls">
  <div class="chef-selector" id="chefSelectorBtns"></div>
</div>
<div class="kitchen-grid" id="kitchenGrid"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDskwJlUNbr3zkKnyY_-n582PdoCrts2AE",
  authDomain: "supertest01-55ac2.firebaseapp.com",
  databaseURL: "https://supertest01-55ac2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "supertest01-55ac2",
  storageBucket: "supertest01-55ac2.firebasestorage.app",

  appId: "1:846236839338:web:260ca9b6af72c69837cfd3"
};
// [FIX] กันจอขาว: ถ้าโหลด Firebase SDK ไม่ได้ (เน็ตหลุด/โดนบล็อก) ให้บอกสาเหตุชัดเจน
if (typeof firebase === 'undefined' || !firebase.initializeApp) {
  document.addEventListener('DOMContentLoaded', () => {

      + '<div style="font-size:56px;">\uD83D\uDCE1</div>'
      + '<div style="font-size:22px;font-weight:bold;">โหลดระบบ Firebase ไม่สำเร็จ</div>'
      + '<div style="font-size:15px;opacity:.85;max-width:420px;line-height:1.7;">อินเทอร์เน็ตอาจหลุด หรือเราเตอร์บล็อกไฟล์จาก gstatic.com<br>กรุณาตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่</div>'
      + '<button onclick="location.reload()" style="margin-top:8px;padding:14px 32px;font-size:17px;border:0;border-radius:10px;background:#3498db;color:#fff;font-weight:bold;">โหลดใหม่</button>'
      + '</div>';

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const BASE_PATH = "racing_order_app/";

// ---- Default data (used for migration if Firebase empty) ----

function esc(v) {
  const m = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => m[c]);
}

// ติดป้าย "กลับบ้าน" ผิดหมด ครัวแพ็คใส่กล่องผิดแบบ
const CHANNEL_TAGS = {
  'กลับบ้าน': { label:'🛍️ กลับบ้าน', bg:'#d35400' },
  'แกรป':     { label:'🟢 แกร็บ',    bg:'#008a3e' },

  'โต๊ะจอง':  { label:'📌 โต๊ะจอง',  bg:'#7d3c98' }
};
// คืน HTML ของชื่อโต๊ะ/ช่องทาง พร้อมป้ายกำกับที่ถูกต้อง (รองรับเลขคิวต่อท้าย เช่น "กลับบ้าน 1", "แกรป 12" และออเดอร์โต๊ะจองอัตโนมัติ)
function tableLabelHtml(raw, small, isReserved, reservedFor) {
  const t = String(raw == null ? '' : raw).trim();
  const cls = 'home-tag' + (small ? ' home-tag-sm' : '');
  const exact = CHANNEL_TAGS[t];
  if (exact) {
    return '<span class="' + cls + '" style="background:' + exact.bg + '">' + esc(exact.label) + '</span>';
  }
  for (const [prefix, tag] of Object.entries(CHANNEL_TAGS)) {
    if (t.startsWith(prefix)) {
      const rest = t.slice(prefix.length).trim();
      if (!rest || /^[0-9A-Za-zก-๙#-]+/.test(rest)) {
        const text = rest ? (tag.label + ' ' + rest) : tag.label;
        return '<span class="' + cls + '" style="background:' + tag.bg + '">' + esc(text) + '</span>';
      }
    }
  }
  if (isReserved || reservedFor) {
    const resTag = CHANNEL_TAGS['โต๊ะจอง'];
    const rName = String(reservedFor == null ? '' : reservedFor).trim();
    const extra = (!small && rName && rName !== t) ? (' (' + rName + ')') : '';
    const text = t ? (resTag.label + ' ' + t + extra) : (resTag.label + extra);
    return '<span class="' + cls + '" style="background:' + resTag.bg + '">' + esc(text) + '</span>';
  }
  return 'โต๊ะ ' + esc(t);
}

function simpleHash(s) { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i); return (h>>>0).toString(16); }

// ---- Firebase listeners ----
function loadChefConfig() {
  db.ref(BASE_PATH+'chefConfig').on('value', snap => {
    if (snap.exists()) {
      const raw = snap.val();
      chefConfig = {};
      nonBatchableItems = []; // [FIX] รีเซ็ตก่อนเสมอ เผื่อกรณีลบรายการแยกจานออกจนหมดแล้ว node __nonBatchable__ ถูกลบ
      Object.entries(raw).forEach(([id, val]) => {
        if (id==='__nonBatchable__') {
          nonBatchableItems = Object.values(val || {});
        } else {
          chefConfig[id] = { name: val.name||DEFAULT_CHEF_NAMES[id]||id, keywords: Object.values(val.keywords||{}) };
        }
      });
    } else {
      // Migrate default
      chefConfig = {};
      const updates = {};
      Object.entries(DEFAULT_CHEF_NAMES).forEach(([id, name]) => {
        const kws = DEFAULT_CHEF_MENUS[id]||[];
        chefConfig[id] = { name, keywords: kws };
        const kwObj = {}; kws.forEach((k,i)=>kwObj[i]=k);
        updates[BASE_PATH+'chefConfig/'+id] = { name, keywords: kwObj };
      });
      nonBatchableItems = [...DEFAULT_NONBATCHABLE];
      const nbObj = {}; DEFAULT_NONBATCHABLE.forEach((k,i)=>nbObj[i]=k);
      updates[BASE_PATH+'chefConfig/__nonBatchable__'] = nbObj;
      db.ref().update(updates);
    }
    rebuildKitchenUI();
    renderOrders();
  });
}

function loadMenuCategories() {
  db.ref(BASE_PATH+'menuConfig').on('value', snap => {
    if (snap.exists()) {
      const raw = snap.val();
      menuCategories = {};
      const catOrder = raw.catOrder || Object.keys(raw.cats||{});
      catOrder.forEach(cat => {
        if (raw.cats?.[cat]) menuCategories[cat] = Object.values(raw.cats[cat].items||{});
      });
    }
  });
}

const HIDDEN_CHEF_LS = 'kds_hidden_chefs_v1';
function getHiddenChefs() {
  try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_CHEF_LS) || '[]')); }
  catch(e) { return new Set(); }
}
function saveHiddenChefs(set) {
  try { localStorage.setItem(HIDDEN_CHEF_LS, JSON.stringify([...set])); } catch(e) {}
}

function rebuildKitchenUI() {
  const grid = document.getElementById('kitchenGrid');
  const selector = document.getElementById('chefSelectorBtns');
  grid.innerHTML = '';
  selector.innerHTML = '';
  const hidden = getHiddenChefs();
  activeChefs = Object.keys(chefConfig).filter(id => id!=='__nonBatchable__');

  activeChefs.forEach(id => {
    const cfg = chefConfig[id];
    const color = CHEF_COLORS[id] || '#555';
    const isHidden = hidden.has(id);

    // column
    const col = document.createElement('div');
    col.className = 'chef-column' + (isHidden ? ' hidden' : '');
    col.id = 'col-'+id;
    col.innerHTML = chefHeaderHtml(id, cfg.name, color) + `<div id="list-${esc(id)}"></div>`;
    grid.appendChild(col);
    initColumnBehaviors(id);

    // selector button
    const btn = document.createElement('button');
    btn.className = 'selector-btn' + (isHidden ? '' : ' active');
    btn.id = 'selbtn-'+id;
    btn.textContent = cfg.name;
    btn.style.borderColor = color;
    btn.onclick = () => {
      const h = getHiddenChefs();
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        btn.style.background='#f8f9fa'; btn.style.color='#555';
        col.classList.add('hidden');
        h.add(id);
      } else {
        btn.classList.add('active');
        btn.style.background=color; btn.style.color='white';
        col.classList.remove('hidden');
        h.delete(id);
      }
      saveHiddenChefs(h);
      updateGridColumns();
    };
    btn.style.background = isHidden ? '#f8f9fa' : color;
    btn.style.color = isHidden ? '#555' : 'white';
    selector.appendChild(btn);
  });

  // [FIX] คอลัมน์สำรอง "ยังไม่ระบุแม่ครัว" — กันออเดอร์หายเงียบเมื่อชื่อเมนูไม่ตรงคีย์เวิร์ดใครเลย
  const ucol = document.createElement('div');
  ucol.className = 'chef-column hidden';
  ucol.id = 'col-' + UNASSIGNED;
  ucol.innerHTML = chefHeaderHtml(UNASSIGNED, '❓ ยังไม่ระบุแม่ครัว', CHEF_COLORS[UNASSIGNED]) + `<div id="list-${UNASSIGNED}"></div>`;
  grid.appendChild(ucol);
  initColumnBehaviors(UNASSIGNED);
  activeChefs.push(UNASSIGNED);

  updateGridColumns();
}

// จำนวนคอลัมน์คำนวณจากคอลัมน์ที่มองเห็นจริง (ไม่นับคอลัมน์ที่ถูกซ่อนด้วยปุ่มเลือกแม่ครัว)
function updateGridColumns() {
  const grid = document.getElementById('kitchenGrid');
  if (!grid) return;
  const visibleCount = activeChefs.filter(id => {
    const col = document.getElementById('col-' + id);
    return col && !col.classList.contains('hidden');
  }).length;
  const n = Math.max(visibleCount, 1);
  grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  grid.classList.remove('cols-1', 'cols-2', 'cols-3', 'cols-4', 'cols-5', 'cols-6');
  grid.classList.add('cols-' + Math.min(n, 6));
  fitKitchenGridHeight();
}

function fitKitchenGridHeight() {
  const grid = document.getElementById('kitchenGrid');
  if (!grid) return;
  requestAnimationFrame(() => {
    const top = grid.getBoundingClientRect().top;
    const available = window.innerHeight - top - 10;
    grid.style.height = Math.max(available, 320) + 'px';
  });
}

// ตอนนี้เทียบทุกคีย์เวิร์ด แล้วเลือกอันที่ "ยาวที่สุด" = เฉพาะเจาะที่สุด
let _chefMatchCache = {};
let _chefMatchSig = '';
function getChefForMenu(itemName) {
  if (!itemName) return null;
  const sig = JSON.stringify(Object.entries(chefConfig).map(([id,c]) => [id, (c.keywords||[]).length]));
  if (sig !== _chefMatchSig) { _chefMatchSig = sig; _chefMatchCache = {}; }
  if (_chefMatchCache[itemName] !== undefined) return _chefMatchCache[itemName];

  let best = null, bestLen = 0;
  for (let [id, cfg] of Object.entries(chefConfig)) {
    if (id==='__nonBatchable__') continue;
    (cfg.keywords||[]).forEach(kw => {
      if (kw && itemName.includes(kw) && kw.length > bestLen) { best = id; bestLen = kw.length; }
    });
  }
  _chefMatchCache[itemName] = best;
  return best;
}

let _lastScrollTs = 0;
let _tapKey = null, _tapTimer = null, _tapEl = null;
const TAP_WINDOW_MS = 2500;    // แตะครั้งที่สองภายใน 2.5 วินาที
const SCROLL_GUARD_MS = 450;   // หลังเลื่อนจอ/ปัด ไม่รับการแตะทันที

function clearTapArm() {
  if (_tapEl) _tapEl.classList.remove('tap-armed');
  _tapEl = null; _tapKey = null;
  clearTimeout(_tapTimer);
}

// คืน true เฉพาะตอนเป็นการแตะครั้งที่ 2 ของปุ่มเดิม
function tapGuard(el, key) {
  const wrap = el && el.closest ? el.closest('.card-wrap.swiped') : null;
  if (wrap) { wrap.classList.remove('swiped'); clearTapArm(); return false; }
  if (Date.now() - _lastScrollTs < SCROLL_GUARD_MS) { clearTapArm(); return false; }
  if (_tapKey === key) { clearTapArm(); return true; }
  clearTapArm();
  _tapKey = key; _tapEl = el;
  if (el) el.classList.add('tap-armed');
  _tapTimer = setTimeout(clearTapArm, TAP_WINDOW_MS);
  return false;
}

function jsAttr(v) { return esc(JSON.stringify(v)); }

// ปัดซ้าย = เปิดปุ่มที่ซ่อนอยู่ด้านหลัง / ปัดขวา = ปิด
function attachSwipe(el) {
  let x0 = 0, y0 = 0, tracking = false;
  const down = e => {
    const p = e.touches ? e.touches[0] : e;
    x0 = p.clientX; y0 = p.clientY; tracking = true;
  };
  const move = e => {
    if (!tracking) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - x0, dy = p.clientY - y0;
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { _lastScrollTs = Date.now(); clearTapArm(); }
  };
  const up = e => {
    if (!tracking) return;
    tracking = false;
    const p = (e.changedTouches && e.changedTouches[0]) || e;
    const dx = p.clientX - x0, dy = p.clientY - y0;
    if (Math.abs(dy) > 60) return;
    if (dx < -45) { el.classList.add('swiped'); _lastScrollTs = Date.now(); }
    else if (dx > 45) { el.classList.remove('swiped'); _lastScrollTs = Date.now(); }
  };
  el.addEventListener('touchstart', down, { passive:true });
  el.addEventListener('touchmove', move, { passive:true });
  el.addEventListener('touchend', up, { passive:true });
  el.addEventListener('mousedown', down);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', up);
}

// ห่อการ์ดด้วยกล่องที่ปัดได้ (เฉพาะการ์ดที่เสร็จแล้วทั้งใบ)
function wrapSwipeCard(card, orderIds, isAllReady) {
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  wrap.appendChild(card);
  if (isAllReady) {
    const btn = document.createElement('button');
    btn.className = 'swipe-btn swipe-hide';
    btn.innerHTML = '🙈<br>ซ่อน';
    btn.onclick = (e) => {
      e.stopPropagation();
      const h = getHiddenOrders();
      (orderIds || []).forEach(id => h.add(id));
      saveHiddenOrders(h);
      renderOrders();
    };
    wrap.appendChild(btn);
    attachSwipe(wrap);
  }
  return wrap;
}

function initColumnBehaviors(id) {
  const hdr = document.getElementById('hdr-' + id);
  if (hdr) attachSwipe(hdr);

function unhideChef(chefId) {
  const h = getHiddenOrders();
  currentOrders.forEach(o => {

  saveHiddenOrders(h);
  const hdr = document.getElementById('hdr-' + chefId);
  if (hdr) hdr.classList.remove('swiped');
  renderOrders();
}

function renderOrders() {
  // [FIX] จำตำแหน่งที่เลื่อนอยู่ของแต่ละคอลัมน์ แล้วคืนหลังวาดใหม่

  const nonbBlocks = [];

  currentOrders.forEach(o => {
    if (hiddenOrders.has(o.id)) {
      const _cid = getChefForMenu(o.item) || UNASSIGNED;
      hiddenCountByChef[_cid] = (hiddenCountByChef[_cid] || 0) + 1;
      return;
    }
    const isNonB = nonBatchableItems.includes(o.item);

    if (!isNonB) {
      const target = batchGroups.find(g =>
        g.item===o.item &&
        (g.comment||'')===(o.comment||'') &&
        !g.subOrders.some(so => so.status==='ready')
      );
      if (target) {
        target.totalQty += Number(o.quantity);
        target.subOrders.push(o);
        if (o.priority) target.priority = true;
        if (new Date(o.timestamp) < new Date(target.minTs)) target.minTs = o.timestamp;
      } else {
        batchGroups.push({ type:'batch', item:o.item, comment:o.comment, totalQty:Number(o.quantity), subOrders:[o], minTs:o.timestamp, priority:!!o.priority });
      }
    } else {
      // non-batchable = ทำพร้อมกันไม่ได้ ต้องต่อคิวตามเวลาสั่งจริงของแต่ละรอบ
      // จึงไม่รวมกับออเดอร์อื่นของโต๊ะเดียวกันที่สั่งมาคนละรอบ แม้เมนู/คอมเมนต์จะเหมือนกันก็ตาม
      const qty = Math.max(1, Number(o.quantity) || 1);
      const doneUnits = o.doneUnits || {};
      const block = { type:'nonb', item:o.item, comment:o.comment, table:o.table, units:[], minTs:o.timestamp, priority:!!o.priority, reservedFor:o.reservedFor||'' };
      for (let i=0; i<qty; i++) {
        block.units.push({ orderId:o.id, unitIndex:i, quantity:qty, done: !!doneUnits[i], timestamp:o.timestamp });
      }
      nonbBlocks.push(block);
    }
  });

  const allCards = [...batchGroups, ...nonbBlocks].sort((a,b) => {
    if (!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
    return new Date(a.minTs)-new Date(b.minTs);
  });

  // ---- หาออเดอร์ที่ "รอนานที่สุด" (ยังไม่เสร็จ) 5 อันดับแรก ในทุกคอลัมน์ ไว้แจ้งเตือนบนแถบด้านบน ----
  // ทำตรงนี้เพื่อให้ไม่ตกหล่น ต่อให้คอลัมน์ของแม่ครัวคนนั้นจะยังไม่ถูกเลื่อนไปดูก็ตาม
  const pendingList = [];

  allCards.forEach(group => {
    // [FIX] เมนูที่ไม่ตรงคีย์เวิร์ดของใครเลย ต้องไปลงคอลัมน์กลาง ห้ามทิ้งหายเด็ดขาด
    const chefId = getChefForMenu(group.item) || UNASSIGNED;
    const listEl = document.getElementById('list-'+chefId);
    if (!listEl) return;
    const color = CHEF_COLORS[chefId] || '#007bff';

    if (group.type === 'batch') {
      const isAllReady = group.subOrders.every(so => so.status==='ready');
      const groupIds = JSON.stringify(group.subOrders.map(so=>so.id));

      if (!isAllReady) {
        const firstPending = group.subOrders.find(so => so.status!=='ready') || group.subOrders[0];
        pendingList.push({
          chefId, chefName: chefNameOf(chefId),
          item: group.item, comment: group.comment,
          table: firstPending && firstPending.table,
          priority: !!(firstPending && firstPending.priority),
          reservedFor: (firstPending && firstPending.reservedFor) || '',
          ts: group.minTs
        });
      }

      let tablesHtml = group.subOrders.map(order => {
        const isReady = order.status==='ready';
        return `<div class="table-item ${isReady?'ready':''}" onclick='event.stopPropagation(); if (tapGuard(this,${jsAttr("i:"+order.id)})) toggleItemReady(${jsAttr(order.id)},${jsAttr(order.status)})'>
          <span>${tableLabelHtml(order.table, false, order.priority, order.reservedFor)}</span>
          <span class="qty-circle" style="${isReady?'':'background:'+color}">${esc(order.quantity)}</span>
        </div>`;
      }).join('');

      const card = document.createElement('div');
      card.className = 'order-card';
      card.style.borderColor = color;
      card.innerHTML = `
        <div class="card-header ${isAllReady?'ready':''}" style="${isAllReady?'':'background:'+color}"
          onclick='if (tapGuard(this,${jsAttr("g:"+group.item+"|"+(group.comment||""))})) toggleGroupReady(${JSON.stringify(groupIds)}, ${isAllReady})'>
          <span>${esc(group.item)}</span>
          <span class="qty-circle" style="background:white; color:${color};">${esc(group.totalQty)}</span>
        </div>
        ${group.comment?`<div class="card-comment">⚠️ ${esc(group.comment)}</div>`:''}
        <div class="table-list">${tablesHtml}</div>`;
      listEl.appendChild(wrapSwipeCard(card, group.subOrders.map(so => so.id), isAllReady));

    } else {
      // non-batchable block: one card per table+item, each plate is its own row
      const units = group.units.slice().sort((a,b) => {
        if (a.orderId !== b.orderId) return new Date(a.timestamp)-new Date(b.timestamp);
        return a.unitIndex - b.unitIndex;
      });
      const totalQty = units.length;
      const remainingQty = units.filter(u => !u.done).length;
      const isAllReady = units.every(u => u.done);

      if (!isAllReady) {
        pendingList.push({
          chefId, chefName: chefNameOf(chefId),
          item: group.item, comment: group.comment,
          table: group.table,
          priority: !!group.priority,
          reservedFor: group.reservedFor || '',
          ts: group.minTs
        });
      }

      const unitsPayload = JSON.stringify(units.map(u => ({ orderId:u.orderId, unitIndex:u.unitIndex, quantity:u.quantity })));

      let unitsHtml = units.map((u, idx) => {
        return `<div class="table-item ${u.done?'ready':''}" onclick='event.stopPropagation(); if (tapGuard(this,${jsAttr("u:"+u.orderId+":"+u.unitIndex)})) toggleNonBUnit(${jsAttr(u.orderId)}, ${u.unitIndex}, ${u.done}, ${u.quantity})'>
          <span>${tableLabelHtml(group.table, false, group.priority, group.reservedFor)} <span style="color:#888;font-size:0.8em;">จานที่ ${idx+1}/${units.length}</span></span>
          <span class="qty-circle" style="${u.done?'':'background:'+color}">${u.done?'✓':''}</span>
        </div>`;
      }).join('');

      const card = document.createElement('div');
      card.className = 'order-card';
      card.style.borderColor = color;
      card.innerHTML = `
        <div class="card-header ${isAllReady?'ready':''}" style="${isAllReady?'':'background:'+color}"
          onclick='if (tapGuard(this,${jsAttr("n:"+group.item+"|"+group.table)})) toggleNonBBlock(${JSON.stringify(unitsPayload)}, ${isAllReady})'>
          <span>${esc(group.item)} — ${tableLabelHtml(group.table, false, group.priority, group.reservedFor)}</span>
          <span class="qty-circle" style="background:white; color:${color};">${esc(remainingQty)}</span>
        </div>
        ${group.comment?`<div class="card-comment">⚠️ ${esc(group.comment)}</div>`:''}
        <div class="table-list">${unitsHtml}</div>`;
      listEl.appendChild(wrapSwipeCard(card, units.map(u => u.orderId), isAllReady));
    }
  });

  // [FIX] เปิด/ปิดคอลัมน์ "ยังไม่ระบุแม่ครัว" ตามว่ามีออเดอร์ค้างอยู่ไหม
  const ucol = document.getElementById('col-' + UNASSIGNED);
  const ulist = document.getElementById('list-' + UNASSIGNED);
  if (ucol && ulist) {
    const has = ulist.children.length > 0;
    const wasHidden = ucol.classList.contains('hidden');
    ucol.classList.toggle('hidden', !has);
    if (wasHidden !== !has) updateGridColumns();
  }

  // [NEW] อัพเดตป้ายจำนวนรายการที่ถูกซ่อนอยู่ของแต่ละคน
  activeChefs.forEach(cid => updateHiddenBadge(cid, hiddenCountByChef[cid] || 0));

  // คืนตำแหน่งที่เลื่อนไว้เดิม
  Object.keys(scrollMemo).forEach(id => {
    const el = document.getElementById('list-'+id);
    if (el && scrollMemo[id]) el.scrollTop = scrollMemo[id];
  });

  pendingQueueTop3 = pendingList
    .sort((a,b) => new Date(a.ts) - new Date(b.ts))
    .slice(0, 5);
  updateQueueAlertDisplay();
}

// ---- แถบเตือน "คิวค้างนานสุด" (5 อันดับแรก) ----
let pendingQueueTop3 = [];

let _queueBarSig = '';   // [FIX] จำหน้าตาเดิม ถ้าไม่เปลี่ยนจะไม่วาดซ้ำ (กันกด chip ไม่ติดตอนรีเฟรช)
function updateQueueAlertDisplay() {
  const bar = document.getElementById('queueAlertBar');
  if (!bar) return;

  if (!pendingQueueTop3.length) {
    const html = `<span>✅ ไม่มีคิวค้างนาน</span>`;
    if (_queueBarSig !== html) {
      _queueBarSig = html;
      bar.classList.remove('urgent');
      bar.style.background = '#34495e';
      bar.innerHTML = html;
      adjustLayoutOffsets();
    }
    return;
  }

  const chipsHtml = pendingQueueTop3.map((p, idx) => {
    const mins = Math.max(0, Math.floor((Date.now() - new Date(p.ts).getTime()) / 60000));
    const isUrgent = mins >= 10;
    const tableTxt = p.table ? ` (${tableLabelHtml(p.table, true, p.priority, p.reservedFor)})` : '';
    const commentTxt = p.comment ? ` <span class="chip-comment">⚠️ ${esc(p.comment)}</span>` : '';
    const chipColor = CHEF_COLORS[p.chefId] || '#7f8c8d';
    return `<span class="queue-alert-chip ${isUrgent?'chip-urgent':''}" style="border-color:${chipColor};" data-chef="${esc(p.chefId)}" onclick="focusChef(this.dataset.chef)">
      <b>${idx+1}.</b> ${esc(p.chefName)} · ${esc(p.item)}${commentTxt}${tableTxt} · ${mins} นาที
    </span>`;
  }).join('');

  const anyUrgent = pendingQueueTop3.some(p => (Date.now() - new Date(p.ts).getTime()) >= 10*60000);
  const html = `<span class="queue-alert-label">⏰ คิวรอนานสุด:</span><div class="queue-alert-chips">${chipsHtml}</div>`;
  bar.classList.toggle('urgent', anyUrgent);
  if (_queueBarSig !== html) {
    _queueBarSig = html;
    bar.style.background = '#34495e';
    bar.innerHTML = html;
    adjustLayoutOffsets();
  }
}
// รีเฟรชตัวเลข "รอมาแล้วกี่นาที" ทุก 15 วินาที แม้ยังไม่มีออเดอร์ใหม่เข้ามา
setInterval(updateQueueAlertDisplay, 15000);

// เผื่อจำนวนบรรทัดของแถบเตือนเปลี่ยน (1 บรรทัด vs 2 บรรทัดตอนจอแคบ) ให้ดันเนื้อหาด้านล่างลงมาตามจริงเสมอ
function adjustLayoutOffsets() {
  const sync = document.getElementById('syncStatusBar');
  const alertBar = document.getElementById('queueAlertBar');
  const controls = document.querySelector('.controls');
  if (!sync || !alertBar || !controls) return;
  requestAnimationFrame(() => {
    const totalHeight = sync.offsetHeight + alertBar.offsetHeight + 10;

}
window.addEventListener('resize', adjustLayoutOffsets);

// แตะชื่อแม่ครัวในแถบเตือน -> ไฮไลต์คอลัมน์นั้น ให้สังเกตง่าย
function focusChef(chefId) {
  const col = document.getElementById('col-' + chefId);
  if (!col) return;
  // [FIX] ถ้าคอลัมน์นั้นถูกซ่อนไว้ ให้เปิดกลับมาให้อัตโนมัติ ไม่งั้นกดแล้วไม่เกิดอะไร
  if (col.classList.contains('hidden')) {
    col.classList.remove('hidden');
    const h = getHiddenChefs(); h.delete(chefId); saveHiddenChefs(h);
    const b = document.getElementById('selbtn-' + chefId);
    if (b) { b.classList.add('active'); b.style.background = CHEF_COLORS[chefId] || '#555'; b.style.color = 'white'; }
    updateGridColumns();
  }
  col.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  col.classList.add('pulse-highlight');
  setTimeout(() => col.classList.remove('pulse-highlight'), 1900);
}

// toggle a single plate/unit of a non-batchable order (does NOT affect the other plates)
function toggleNonBUnit(orderId, unitIndex, currentlyDone, quantity) {
  const newDone = !currentlyDone;
  const order = currentOrders.find(o => o.id === orderId);
  const doneUnits = Object.assign({}, (order && order.doneUnits) || {});
  if (newDone) doneUnits[unitIndex] = true;
  else delete doneUnits[unitIndex];

  let allDone = true;
  for (let i=0; i<quantity; i++) { if (doneUnits[i] !== true) { allDone = false; break; } }

  const updates = {};
  updates[BASE_PATH+'orders/'+orderId+'/doneUnits/'+unitIndex] = newDone ? true : null;
  updates[BASE_PATH+'orders/'+orderId+'/status'] = allDone ? 'ready' : 'pending';
  db.ref().update(updates);
}

// toggle ALL plates within a table+item block at once (from the card header)
function toggleNonBBlock(unitsPayloadStr, isAllReady) {
  const units = JSON.parse(unitsPayloadStr);
  const newDone = !isAllReady;
  const updates = {};
  const touchedOrderQty = {};
  units.forEach(u => {
    updates[BASE_PATH+'orders/'+u.orderId+'/doneUnits/'+u.unitIndex] = newDone ? true : null;
    touchedOrderQty[u.orderId] = u.quantity;
  });
  Object.keys(touchedOrderQty).forEach(oid => {
    updates[BASE_PATH+'orders/'+oid+'/status'] = newDone ? 'ready' : 'pending';
  });
  db.ref().update(updates);
}

// ---- Boot ----
// [FIX] กันจอครัวดับเองระหว่างใช้งาน (ทำงานเฉพาะเบราว์เซอร์ที่รองรับ ถ้าไม่รองรับก็ไม่มีผลเสีย)
let _wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener('release', () => { _wakeLock = null; });
    }
  } catch (e) { /* อุปกรณ์/เบราว์เซอร์ไม่รองรับ - ข้ามไป */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !_wakeLock) requestWakeLock();
});

window.addEventListener('load', () => {
  requestWakeLock();
  initAccessCode();
  db.ref(BASE_PATH+'menuPrices').on('value', snap => { menuPrices = snap.val()||{}; });
  loadMenuCategories();
  loadChefConfig();

  db.ref(BASE_PATH+'orders').on('value', snap => {
    const data = snap.val();
    if (!window.ghostRemoveTries) window.ghostRemoveTries = {};
    const rawOrders = data ? Object.entries(data).map(([id,val])=>({id,...val})) : [];
    // --- กันออเดอร์ผี: บาง record อาจเหลือแค่บาง field (เช่น status) เพราะเครื่องหนึ่งออฟไลน์แล้วมี
    // เครื่องอื่นลบออเดอร์นั้นไปก่อนที่คำสั่งค้างจะ sync กลับมา ทำให้ path ถูกสร้างใหม่แบบข้อมูลไม่ครบ
    // (ไม่มี table/item) -> กรองไม่ให้แสดง และลบทิ้งออกจากฐานข้อมูลอัตโนมัติ
    const ghostOrders = rawOrders.filter(o => !o.table || !o.item);
    // [FIX] จำกัดจำนวนครั้งที่พยายามลบ กันกรณี Rules ไม่อนุญาตแล้ววนลบไม่สิ้นสุด จนโควต้าหมด
    if (ghostOrders.length > 0) {
      ghostOrders.forEach(o => {
        const tries = (ghostRemoveTries[o.id] || 0);
        if (tries >= 3) return;
        ghostRemoveTries[o.id] = tries + 1;
        db.ref(BASE_PATH+'orders/'+o.id).remove().catch(() => {});
      });
    }
    currentOrders = rawOrders.filter(o => o.table && o.item);
    renderOrders();
  });

  let offlineSince = null; // เวลาที่เริ่มหลุด ใช้กันการเด้งเตือนเร็วเกินไปตอนหลุดแป๊บเดียว
  db.ref('.info/connected').on('value', snap => {
    const overlay = document.getElementById('offlineOverlay');
    document.getElementById('syncStatusText').textContent = snap.val() ? 'เชื่อมต่อครัวออนไลน์' : 'ขาดการเชื่อมต่อ!';
    document.getElementById('syncStatusBar').classList.toggle('offline', !snap.val());

    if (snap.val()) {
      window.isOnline = true;
      offlineSince = null;
      overlay.classList.remove('show'); // ปลดล็อกหน้าจอทันทีที่กลับมาออนไลน์
    } else {
      window.isOnline = false;
      if (!offlineSince) offlineSince = Date.now();
      // หน่วง 1.5 วิ ก่อนเด้ง overlay กันหลุดสัญญาณแป๊บเดียวๆ (blip) แล้วรบกวนการทำงาน
      setTimeout(() => {
        if (!window.isOnline && offlineSince) overlay.classList.add('show');
      }, 1500);
    }
  });
});

// ================= ระบบ Access Code (ใช้ Firebase path เดียวกับระบบรับออเดอร์) =================
const ACCESS_CODE_FB_PATH = BASE_PATH + 'accessCode';
const ACCESS_LS_KEY = 'access_code_v1';

function simpleHashAccess(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
}

function checkAccessCode() {
    const input = document.getElementById('accessInput').value.trim();
    const errEl = document.getElementById('accessError');
    if (!input) { errEl.textContent = '❌ กรุณาใส่รหัสก่อน'; return; }
    errEl.textContent = '';

    db.ref(ACCESS_CODE_FB_PATH).once('value', snap => {
        const stored = snap.val();
        if (!stored) {
            db.ref(ACCESS_CODE_FB_PATH).set(simpleHashAccess(input)).then(() => {
                localStorage.setItem(ACCESS_LS_KEY, simpleHashAccess(input));
                unlockApp();
            });
            return;
        }
        if (simpleHashAccess(input) === stored) {
            localStorage.setItem(ACCESS_LS_KEY, stored);
            unlockApp();
        } else {
            errEl.textContent = '❌ รหัสไม่ถูกต้อง';
            document.getElementById('accessInput').value = '';
            document.getElementById('accessInput').focus();
        }
    });
}

function unlockApp() {
    document.getElementById('accessOverlay').classList.remove('show');
}

function lockApp() {
    document.getElementById('accessInput').value = '';
    document.getElementById('accessError').textContent = '';
    document.getElementById('accessOverlay').classList.add('show');
    setTimeout(() => document.getElementById('accessInput').focus(), 100);
}

function initAccessCode() {
    // Step 1: ล็อคไว้ก่อนเสมอ — ห้าม unlock จนกว่า Firebase server จริงจะยืนยัน
    lockApp();

    // Step 2: ดึงค่าจาก Firebase REST API โดยตรง (ข้าม SDK cache ทั้งหมด)
    const dbUrl = 'https://supertest01-55ac2-default-rtdb.asia-southeast1.firebasedatabase.app/';
    fetch(dbUrl + ACCESS_CODE_FB_PATH + '.json?t=' + Date.now())
        .then(r => r.json())
        .then(stored => {
            const saved = localStorage.getItem(ACCESS_LS_KEY);
            if (!stored) {
                unlockApp(); // ยังไม่มีรหัสในระบบ → เข้าได้เลย (ครั้งแรก)
            } else if (saved && saved === stored) {
                unlockApp(); // รหัสตรงกับ server → เข้าได้
            }
            // กรณีอื่น → คง locked ไว้
        })
        .catch(() => {
            // [FIX] เน็ตสะดุดตอนเปิดเครื่อง: ถ้าเคยจำรหัสที่ถูกไว้ ให้ SDK ยืนยันแทน ไม่งั้นล็อกถาวร
            const saved = localStorage.getItem(ACCESS_LS_KEY);
            if (!saved) { lockApp(); return; }
            db.ref(ACCESS_CODE_FB_PATH).once('value')
                .then(snap => {
                    const stored = snap.val();
                    if (!stored || saved === stored) unlockApp();
                })
                .catch(() => lockApp());
        })
        .then(() => {
            // [FIX] ติด listener เสมอ ไม่ว่า fetch จะสำเร็จหรือพัง
            if (window._accessWatching) return;
            window._accessWatching = true;
            db.ref(ACCESS_CODE_FB_PATH).on('value', snap => {
                const newStored = snap.val();
                const nowSaved = localStorage.getItem(ACCESS_LS_KEY);
                if (!newStored) return;
                if (!nowSaved || nowSaved !== newStored) {
                    lockApp(); // รหัสเปลี่ยน → ล็อคทันที
                }
            });
        });
}
// ================= จบระบบ Access Code =================
</script>

<!-- ================= ระบบล็อกเข้าใช้งาน (รหัสร้าน + ชื่อพนักงาน) ================= -->

<script>
(function () {

  if (window.__APP_GATE__) return;
  window.__APP_GATE__ = true;

  var NEED_CODE = false;                 // false = แอปนี้มีระบบรหัสของตัวเองอยู่แล้ว
  var APP_LABEL = 'จอแม่ครัว';
  var DB_URL    = 'https://supertest01-55ac2-default-rtdb.asia-southeast1.firebasedatabase.app/';
  var CODE_PATH = 'racing_order_app/accessCode';
  var LS_CODE   = 'access_code_v1';
  var LS_NAME   = 'staff_name';

  function hashCode(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var css = document.createElement('style');
  css.textContent =
    '#gateOv{display:none;position:fixed;inset:0;background:rgba(17,20,24,.92);z-index:2147483000;' +
    'align-items:center;justify-content:center;font-family:inherit;padding:16px}' +
    '#gateOv.on{display:flex}' +
    '#gateBox{background:#fff;border-radius:16px;padding:28px 24px;max-width:340px;width:100%;' +
    'box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;box-sizing:border-box}' +
    '#gateBox .g-ico{font-size:34px;line-height:1}' +
    '#gateBox .g-ttl{font-size:19px;font-weight:700;color:#2c3e50;margin-top:6px}' +
    '#gateBox .g-sub{font-size:14px;color:#7f8c8d;margin-top:6px}' +
    '#gateBox input{width:100%;font-size:21px;padding:11px 14px;border:2px solid #4CAF50;border-radius:9px;' +
    'text-align:center;box-sizing:border-box;margin:15px 0 4px;-webkit-appearance:none}' +
    '#gateBox input:focus{outline:none;border-color:#2ecc71}' +
    '#gateBox button{background:linear-gradient(135deg,#4CAF50,#2ecc71);color:#fff;border:none;' +
    'padding:12px 20px;border-radius:9px;font-size:17px;font-weight:700;cursor:pointer;width:100%;margin-top:11px}' +
    '#gateBox button:disabled{opacity:.5;cursor:default}' +
    '#gateErr{color:#e74c3c;font-size:14px;min-height:20px;margin:8px 0 0;font-weight:600}' +
    '#gateApp{font-size:12px;color:#b2bec3;margin-top:14px;letter-spacing:.3px}';
  document.head.appendChild(css);

  var ov = document.createElement('div');
  ov.id = 'gateOv';
  ov.innerHTML =
    '<div id="gateBox">' +
      '<div class="g-ico" id="gateIco">🔒</div>' +
      '<div class="g-ttl" id="gateTtl"></div>' +
      '<div class="g-sub" id="gateSub"></div>' +
      '<input id="gateInp" autocomplete="off">' +
      '<p id="gateErr"></p>' +
      '<button id="gateBtn"></button>' +
      '<div id="gateApp"></div>' +
    '</div>';

  function boot() {
    document.body.appendChild(ov);
    var inp = document.getElementById('gateInp');
    var btn = document.getElementById('gateBtn');
    var err = document.getElementById('gateErr');
    document.getElementById('gateApp').textContent = APP_LABEL;

    var step = null;

    function show(s) {
      step = s;
      err.textContent = '';
      btn.disabled = false;
      if (s === 'code') {
        document.getElementById('gateIco').textContent = '🔒';
        document.getElementById('gateTtl').textContent = 'ใส่รหัสเข้าใช้งาน';
        document.getElementById('gateSub').textContent = 'รหัสเดียวกับระบบรับออเดอร์ · ใส่แค่ครั้งแรก';
        inp.type = 'password';
        inp.maxLength = 12;
        inp.placeholder = '••••••';
        btn.textContent = '✅ เข้าใช้งาน';
      } else {
        document.getElementById('gateIco').textContent = '👤';
        document.getElementById('gateTtl').textContent = 'ยินดีต้อนรับ!';
        document.getElementById('gateSub').textContent = 'พิมพ์ชื่อของคุณเพื่อเริ่มใช้งาน';
        inp.type = 'text';
        inp.maxLength = 20;
        inp.placeholder = 'ชื่อพนักงาน';
        btn.textContent = '✅ เริ่มงาน';
      }
      inp.value = '';
      ov.classList.add('on');
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);
    }

    function hide() { ov.classList.remove('on'); }

    function applyName(name) {
      lsSet(LS_NAME, name);
      window.APP_STAFF_NAME = name;
      // ส่งต่อให้แอปที่ใช้ชื่อคนละคีย์
      lsSet('cashier_staff', name);
      if (typeof window.STAFF !== 'undefined') window.STAFF = name;
      if (typeof window.currentStaffName !== 'undefined') window.currentStaffName = name;
      try { if (typeof window.updateStaffBadge === 'function') window.updateStaffBadge(); } catch (e) {}
      try { window.dispatchEvent(new CustomEvent('staffnamechange', { detail: name })); } catch (e) {}
    }

    function needName() {
      var n = (lsGet(LS_NAME) || '').trim();
      if (n) { applyName(n); hide(); return; }
      show('name');
    }

    function submit() {
      var v = (inp.value || '').trim();
      if (!v) { err.textContent = step === 'code' ? '❌ กรุณาใส่รหัสก่อน' : '❌ กรุณาใส่ชื่อ'; return; }
      if (step === 'name') { applyName(v); hide(); return; }
      err.textContent = '';
      btn.disabled = true;
      fetch(DB_URL + CODE_PATH + '.json?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (stored) {
          btn.disabled = false;
          var h = hashCode(v);
          if (!stored) {                       // ยังไม่เคยตั้งรหัส → ตั้งครั้งแรก
            if (window.firebase && firebase.apps && firebase.apps.length) {
              firebase.database().ref(CODE_PATH).set(h);
            }
            lsSet(LS_CODE, h); needName(); return;
          }
          if (h === stored) { lsSet(LS_CODE, stored); needName(); }
          else { err.textContent = '❌ รหัสไม่ถูกต้อง'; inp.value = ''; inp.focus(); }
        })
        .catch(function () {
          btn.disabled = false;
          err.textContent = '❌ เชื่อมต่อ Firebase ไม่ได้ ลองใหม่';
        });
    }

    btn.onclick = submit;
    inp.onkeydown = function (e) { if (e.key === 'Enter') submit(); };

    // เปลี่ยนชื่อพนักงานได้ตลอด (เรียกจาก console หรือปุ่มในแอป)
    window.appChangeStaffName = function () { show('name'); };
    window.appLockNow = function () { show(NEED_CODE ? 'code' : 'name'); };

    if (!NEED_CODE) { needName(); return; }

    show('code');                              // ล็อกไว้ก่อนเสมอ
    fetch(DB_URL + CODE_PATH + '.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (stored) {
        var saved = lsGet(LS_CODE);
        if (!stored || (saved && saved === stored)) needName();
        // เฝ้าดูการเปลี่ยนรหัส → ล็อกทุกเครื่องทันที
        if (window.firebase && firebase.apps && firebase.apps.length) {
          firebase.database().ref(CODE_PATH).on('value', function (snap) {
            var cur = snap.val();
            if (!cur) return;
            if (lsGet(LS_CODE) !== cur) show('code');
          });
        }
      })
      .catch(function () { show('code'); });
  }

  /* หน้าจอครัวมีระบบรหัสร้าน (#accessOverlay / initAccessCode) ของตัวเองอยู่แล้ว
     และไม่ได้ใช้ชื่อพนักงานรายคน — ปิดการ auto-boot() ของ #gateOv เพื่อไม่ให้เด้งซ้อนทับหน้าล็อกรหัสร้าน */
  // if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  // else boot();
})();
</script>
<!-- ================= จบระบบล็อกเข้าใช้งาน ================= -->
</body>
</html>
